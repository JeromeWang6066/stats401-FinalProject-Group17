  <style>
    :root { --ink: #111; --muted: #5a5a5a; --line: #e4e4e4; --red: #e10600; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
    }
    label { color: var(--muted); font-size: 12px; margin-right: 4px; }
    select { font: inherit; padding: 4px 6px; }
    .status { color: var(--muted); font-size: 12px; margin-left: auto; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 20px 32px; }
    .panel { border: 1px solid var(--line); overflow: hidden; }
    .panel h2 {
      margin: 0;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    .panel h2 span { color: var(--muted); font-weight: 400; margin-left: 8px; }
    #chart-a { display: block; width: 100%; height: min(72vh, 680px); overflow: hidden; }
    .empty { fill: var(--muted); font-size: 13px; }
  </style>
</head>

      node.append("text")
        .text((d) => d.id)
        .attr("y", (d) => rad(d) + 11)
        .attr("text-anchor", "middle")
        .attr("font-size", 10)
        .attr("fill", "#111");

      node.call(d3.drag()
        .on("start", (event, d) => {
          if (!event.active && sim) sim.alphaTarget(0.15).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => {
          if (!event.active && sim) sim.alphaTarget(0);
          d.fx = null; d.fy = null;
        }));

      function fit() {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const d of nodes) {
          const r = rad(d);
          minX = Math.min(minX, d.x - r);
          maxX = Math.max(maxX, d.x + r);
          minY = Math.min(minY, d.y - r);
          maxY = Math.max(maxY, d.y + r + 14);
        }
        const bw = Math.max(maxX - minX, 1);
        const bh = Math.max(maxY - minY, 1);
        const scale = 0.88 * Math.min(W / bw, H / bh);
        const tx = (W - scale * bw) / 2 - scale * minX;
        const ty = (H - scale * bh) / 2 - scale * minY;
        g.attr("transform", `translate(${tx},${ty}) scale(${scale})`);
      }

      const span = Math.min(W, H);
      sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id((d) => d.id)
          .distance((d) => 36 + span * 0.06 * (1 - d.w / maxW))
          .strength(0.65))
        .force("charge", d3.forceManyBody().strength(-Math.min(160, span * 0.28)))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collide", d3.forceCollide().radius((d) => rad(d) + 10).iterations(2))
        .velocityDecay(0.32)
        .on("tick", () => {
          link
            .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
          node.attr("transform", (d) => `translate(${d.x},${d.y})`);
          fit();
        });
    }

    function render() {
      const year = document.getElementById("year").value;
      const circuit = document.getElementById("circuit").value;
      const mode = document.getElementById("mode").value;
      const dir = directedWeights(year, circuit, mode);
      const und = undirectedList(dir);
      const nets = netsFrom(dir);
      const shown = Math.min(EDGE_CAP, und.length);
      document.getElementById("status").textContent =
        `无向交手 ${und.length} 对，画出 ${shown} 对`;
      drawA(und, nets, year);
    }

    document.getElementById("year").addEventListener("change", render);
    document.getElementById("circuit").addEventListener("change", render);
    document.getElementById("mode").addEventListener("change", render);
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 120);
    });
    render();
  </script>
</body>
</html>
